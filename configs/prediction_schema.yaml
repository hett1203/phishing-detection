# ============================================================
# prediction_schema.yaml - Output schema for the prediction pipeline
# Numeric -1/1 internally mapped to "phising"/"safe" in user-facing output.
# ============================================================
prediction:
  # Internal numeric label -> output string label
  # IMPORTANT: spelling "phising" matches the reference predicted_file.csv
  # provided by the UCI dataset curators. Do NOT auto-correct to "phishing".
  label_map:
    "-1": "phising"
    "1": "safe"

  # Output column ordering
  output_columns:
    - having_IP_Address
    - URL_Length
    - Shortining_Service
    - having_At_Symbol
    - double_slash_redirecting
    - Prefix_Suffix
    - having_Sub_Domain
    - SSLfinal_State
    - Domain_registeration_length
    - Favicon
    - port
    - HTTPS_token
    - Request_URL
    - URL_of_Anchor
    - Links_in_tags
    - SFH
    - Submitting_to_email
    - Abnormal_URL
    - Redirect
    - on_mouseover
    - RightClick
    - popUpWidnow
    - Iframe
    - age_of_domain
    - DNSRecord
    - web_traffic
    - Page_Rank
    - Google_Index
    - Links_pointing_to_page
    - Statistical_report
    - Result                # string label: "phising" or "safe"
    - confidence           # max-class probability [0, 1]
    - probability_phishing # P(class = phising)

  # Single-prediction display strings (used by Streamlit UI)
  display:
    phishing_title: "Phishing Website Detected"
    phishing_color: "#FF3B3B"
    safe_title: "Legitimate Website"
    safe_color: "#00E676"
    risk_gauge_high: 0.65
    risk_gauge_medium: 0.35

# Per-feature plain-language security tips (used in explainability page)
feature_security_tips:
  having_IP_Address:
    "-1": "URL uses an IP address in place of a domain - a common phishing indicator."
    "0": "URL uses a domain (typical of legitimate sites)."
    "1": "URL uses a registered domain name (legitimate)."
  URL_Length:
    "-1": "URL is abnormally long - often a sign of obfuscation."
    "0": "URL length is normal."
    "1": "URL is short, typically legitimate."
  Shortining_Service:
    "-1": "URL uses a shortening service (bit.ly, tinyurl) - frequently abused by phishers."
    "0": "No shortening service detected."
    "1": "Direct URL, no shortener."
  having_At_Symbol:
    "-1": "URL contains an '@' symbol, used to obscure the true destination."
    "0": "No '@' symbol in URL."
    "1": "Standard URL format."
  double_slash_redirecting:
    "-1": "URL contains '//', indicating an embedded redirect - risky."
    "0": "No double-slash redirect."
    "1": "Standard path separator only."
  Prefix_Suffix:
    "-1": "Domain has a hyphen (-), common in phishing subdomains."
    "0": "Domain has no hyphen."
    "1": "Clean domain name."
  having_Sub_Domain:
    "-1": "Multiple subdomains detected (e.g., a.b.example.com) - suspicious."
    "0": "Single subdomain level."
    "1": "No suspicious multi-level subdomain."
  SSLfinal_State:
    "-1": "No HTTPS / self-signed or expired certificate - critical risk."
    "0": "HTTPS with mixed issuer, partial trust."
    "1": "Valid HTTPS certificate from a trusted CA (legitimate)."
  Domain_registeration_length:
    "-1": "Domain registered for less than 1 year - common in phishing campaigns."
    "0": "Registration length unknown / short."
    "1": "Domain registered for >= 1 year (legitimate)."
  Favicon:
    "-1": "Favicon loaded from an external domain - potential impersonation."
    "0": "No external favicon."
    "1": "Favicon served from same domain."
  port:
    "-1": "Non-standard open ports detected - suspicious."
    "0": "Standard ports only."
    "1": "Only standard ports (80/443) open."
  HTTPS_token:
    "-1": "HTTPS token present in the URL path (not protocol) - deceptive."
    "0": "No HTTPS token in path."
    "1": "HTTPS used correctly at protocol level."
  Request_URL:
    "-1": "Many request URLs point to a different domain - phishing."
    "0": "Mixed domain requests."
    "1": "Same-domain request URLs."
  URL_of_Anchor:
    "-1": "Anchor tags point to foreign domains / suspicious hrefs."
    "0": "Mixed anchor targets."
    "1": "Anchors link to legitimate same-domain targets."
  Links_in_tags:
    "-1": "Meta/script links mostly foreign - phishing."
    "0": "Mixed link sources."
    "1": "Most links same-domain - legitimate."
  SFH:
    "-1": "Server Form Handler points to foreign domain - phishing."
    "0": "SFH is empty or about:blank."
    "1": "SFH points to same domain."
  Submitting_to_email:
    "-1": "Form submits to an email address - classic phishing pattern."
    "0": "No email submission."
    "1": "Standard server-side form submission."
  Abnormal_URL:
    "-1": "Abnormal URL - hostname not in URL content - phishing."
    "0": "Slight abnormality."
    "1": "URL content matches hostname."
  Redirect:
    "-1": "Page uses multiple redirects - suspicious."
    "0": "Standard single redirect."
    "1": "No suspicious redirect."
  on_mouseover:
    "-1": "onMouseOver changes the status bar - deceptive."
    "0": "No onMouseOver status change."
    "1": "No deceptive mouseover."
  RightClick:
    "-1": "Right-click disabled - blocks inspection, suspicious."
    "0": "Right-click partially blocked."
    "1": "Right-click enabled."
  popUpWidnow:
    "-1": "Pop-up window used to inject phishing content."
    "0": "Limited pop-up usage."
    "1": "No phishing pop-up."
  Iframe:
    "-1": "Hidden iframe used to load external content - phishing."
    "0": "Standard iframe usage."
    "1": "No hidden iframe."
  age_of_domain:
    "-1": "Domain is less than 6 months old - phishing risk."
    "0": "Domain age unknown."
    "1": "Domain is 6+ months old - legitimate."
  DNSRecord:
    "-1": "No DNS records found - suspicious / disposable domain."
    "0": "Partial DNS records."
    "1": "Full DNS records present."
  web_traffic:
    "-1": "Very low traffic - recently created phishing site."
    "0": "Moderate traffic."
    "1": "High web traffic - established legitimate site."
  Page_Rank:
    "-1": "No / very low PageRank - phishing."
    "0": "Low PageRank."
    "1": "High PageRank - legitimate."
  Google_Index:
    "-1": "Not indexed by Google - suspicious / new."
    "0": "Partially indexed."
    "1": "Google-indexed - legitimate."
  Links_pointing_to_page:
    "-1": "Zero or very few inbound links - phishing."
    "0": "Few inbound links."
    "1": "Many inbound links - legitimate."
  Statistical_report:
    "-1": "Host appears on threat-intel blocklists - phishing."
    "0": "Host on a watchlist."
    "1": "Host not on any blocklist - legitimate."
