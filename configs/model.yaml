# ============================================================
# model.yaml - Model storage and versioning configuration
# ============================================================
versioning:
  scheme: "v{version}"           # v1, v2, ...
  current_version: "v1"
  keep_top_n: 3                  # how many previous model versions to retain

storage:
  backend: joblib                # joblib | pickle
  joblib_compression: 3
  pickle_protocol: 5

# Per-model artifact paths (relative to artifacts/models/trained_models/)
models:
  RandomForest:
    file: random_forest.joblib
    type: sklearn
  ExtraTrees:
    file: extra_trees.joblib
    type: sklearn
  XGBoost:
    file: xgboost.joblib
    type: xgboost
  LightGBM:
    file: lightgbm.joblib
    type: lightgbm
  CatBoost:
    file: catboost.joblib
    type: catboost
  HistGradientBoosting:
    file: hist_gbm.joblib
    type: sklearn
  GradientBoosting:
    file: gradient_boosting.joblib
    type: sklearn
  AdaBoost:
    file: adaboost.joblib
    type: sklearn
  Bagging:
    file: bagging.joblib
    type: sklearn
  VotingEnsemble:
    file: voting_ensemble.joblib
    type: sklearn
  StackingEnsemble:
    file: stacking_ensemble.joblib
    type: sklearn
  AutoGluon:
    file: autogluon
    type: autogluon         # directory, not file

# Preprocessing / feature-selection pipeline
preprocessing:
  feature_engineer: feature_engineer.joblib
  feature_selector: feature_selector.joblib
  cluster_model: cluster_model.joblib
  label_encoder: label_encoder.joblib
  metadata: metadata.joblib

# Best model selection (chosen at the end of training.py)
best_model:
  selection_metric: recall_phishing   # = recall on class -1
  tiebreak_metric: roc_auc
  file: best_model.joblib
  metadata: best_model_metadata.json
