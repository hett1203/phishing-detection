# ============================================================
# config.yaml - Master configuration for Phishing Website Detection
# ============================================================
project:
  name: "Phishing Website Detection System"
  version: "1.0.0"
  description: >-
    Production-grade ML system for classifying phishing vs. legitimate
    websites using pre-engineered lexical, host-based, and content-based
    URL features from the UCI Phishing Websites Dataset.
  author: "M.S. Data Science Project"
  license: "MIT"

paths:
  # Input data
  raw_data_dir: artifacts/data/raw
  validated_data_dir: artifacts/data/validated
  processed_data_dir: artifacts/data/processed

  # Feature / cluster artifacts
  features_dir: artifacts/features
  clusters_dir: artifacts/clusters

  # Models
  models_base_dir: artifacts/models
  trained_models_dir: artifacts/models/trained_models
  autogluon_dir: artifacts/models/autogluon
  preprocessing_dir: artifacts/models/preprocessing

  # Evaluation / reports
  evaluations_dir: artifacts/evaluations
  reports_dir: artifacts/reports
  figures_dir: artifacts/reports/figures

  # Predictions
  predictions_dir: artifacts/predictions

  # SHAP / explainability
  shap_dir: artifacts/shap

  # Configs
  configs_dir: configs

# File names
files:
  train_data: phising_08012020_120000.csv
  test_data: phisingtest.csv
  predicted_reference: predicted_file.csv
  train_processed: train_processed.csv
  test_processed: test_processed.csv
  validation_report: validation_report.json
  feature_store: selected_features.json
  cluster_report: cluster_report.json
  model_comparison: model_comparison.csv
  final_metrics: final_metrics.json
  label_encoder: label_encoder.joblib

# Randomness
random_state: 42

# Logging
logging_config: configs/logging.yaml

# Schema configs
schema_config: configs/schema.yaml
params_config: configs/params.yaml
model_config: configs/model.yaml
prediction_schema_config: configs/prediction_schema.yaml
