# ============================================================
# logging.yaml - Structured logging configuration
# ============================================================
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "[%(asctime)s] [%(levelname)-8s] [%(name)-20s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "[%(asctime)s] [%(levelname)-8s] [%(name)-20s] [%(filename)s:%(lineno)d] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  simple:
    format: "%(levelname)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_app:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: artifacts/reports/logs/app.log
    maxBytes: 5242880
    backupCount: 3

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: artifacts/reports/logs/error.log
    maxBytes: 5242880
    backupCount: 3

root:
  level: INFO
  handlers: [console, file_app, file_error]
  propagate: false

loggers:
  phishing_detection:
    level: INFO
    handlers: [console, file_app]
    propagate: false
  phishing_detection.data:
    level: INFO
    propagate: true
  phishing_detection.models:
    level: INFO
    propagate: true
  phishing_detection.prediction:
    level: INFO
    propagate: true
