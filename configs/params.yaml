# ============================================================
# params.yaml - Hyperparameters for all ML stages
# ============================================================

# ---------------- Data Splits ----------------
splits:
  test_size: 0.20
  val_size: 0.20   # within training set
  random_state: 42
  stratify: true

# ---------------- Feature Engineering ----------------
feature_engineering:
  interaction_features: true   # build pairwise products of top-K MI features
  top_k_interactions: 8
  polynomial_degree: 2
  apply_pca: false              # data is already ternary-encoded, PCA optional
  pca_components: 10

# ---------------- Feature Selection ----------------
feature_selection:
  methods:
    - mutual_information
    - model_based          # RF / XGBoost importance
    - recursive_elimination
  top_k: 15
  # The original 30 features are always retained (they are the dataset's
  # identity); selected engineered features are layered on top.
  keep_original_features: true

# ---------------- Clustering (unsupervised, optional) ----------------
clustering:
  enabled: true
  algorithms:
    - KMeans
    - MiniBatchKMeans
    - GaussianMixture
    - AgglomerativeClustering
    - Birch
    - DBSCAN
    - HDBSCAN
    - OPTICS
    - MeanShift
    - SpectralClustering
  kmeans:
    n_clusters: 5
    random_state: 42
    n_init: 10
  minibatch_kmeans:
    n_clusters: 5
    random_state: 42
    batch_size: 1024
  gmm:
    n_components: 5
    random_state: 42
    covariance_type: full
  agglomerative:
    n_clusters: 5
    linkage: ward
  birch:
    n_clusters: 5
    threshold: 0.5
  dbscan:
    eps: 0.8
    min_samples: 25
  hdbscan:
    min_cluster_size: 50
    min_samples: 25
  optics:
    min_samples: 25
    xi: 0.05
    min_cluster_size: 0.05
  meanshift:
    bandwidth: null    # estimated via estimate_bandwidth
  spectral:
    n_clusters: 5
    random_state: 42
    affinity: nearest_neighbors
  selection_metric: silhouette   # primary; db & ch reported

# ---------------- Supervised Classification ----------------
classification:
  primary_metric: recall_phishing   # missing a phishing site is costliest
  random_state: 42
  cv_folds: 5
  n_optuna_trials: 30
  optuna_timeout_seconds: 300

  models:
    RandomForest:
      enabled: true
      params:
        n_estimators: 400
        max_depth: null
        max_features: sqrt
        min_samples_split: 5
        min_samples_leaf: 2
        class_weight: balanced
        random_state: 42
        n_jobs: -1

    ExtraTrees:
      enabled: true
      params:
        n_estimators: 500
        max_depth: null
        max_features: sqrt
        min_samples_split: 5
        min_samples_leaf: 2
        class_weight: balanced
        random_state: 42
        n_jobs: -1

    XGBoost:
      enabled: true
      params:
        n_estimators: 400
        max_depth: 6
        learning_rate: 0.1
        subsample: 0.9
        colsample_bytree: 0.9
        min_child_weight: 3
        gamma: 0.0
        reg_alpha: 0.0
        reg_lambda: 1.0
        random_state: 42
        n_jobs: -1
        tree_method: hist
        eval_metric: logloss

    LightGBM:
      enabled: true
      params:
        n_estimators: 400
        max_depth: -1
        num_leaves: 63
        learning_rate: 0.1
        subsample: 0.9
        colsample_bytree: 0.9
        min_child_samples: 20
        reg_alpha: 0.0
        reg_lambda: 0.0
        random_state: 42
        n_jobs: -1
        verbose: -1

    CatBoost:
      enabled: true
      params:
        iterations: 400
        depth: 6
        learning_rate: 0.1
        l2_leaf_reg: 3.0
        random_state: 42
        verbose: false
        allow_writing_files: false

    HistGradientBoosting:
      enabled: true
      params:
        max_iter: 400
        max_depth: null
        learning_rate: 0.1
        l2_regularization: 1.0
        random_state: 42

    GradientBoosting:
      enabled: true
      params:
        n_estimators: 300
        max_depth: 4
        learning_rate: 0.1
        subsample: 0.9
        random_state: 42

    AdaBoost:
      enabled: true
      params:
        n_estimators: 300
        learning_rate: 0.3
        random_state: 42

    Bagging:
      enabled: true
      params:
        n_estimators: 200
        max_samples: 0.9
        max_features: 0.9
        random_state: 42
        n_jobs: -1

  ensembles:
    voting:
      enabled: true
      voters: [RandomForest, ExtraTrees, XGBoost, LightGBM, CatBoost]
      voting_type: soft
      weights: [2, 2, 3, 3, 2]
    stacking:
      enabled: true
      base_models: [RandomForest, ExtraTrees, LightGBM, CatBoost]
      meta_model: LogisticRegression
      cv_folds: 5

  autogluon:
    enabled: true
    time_limit_seconds: 300
    presets: best_quality
    eval_metric: roc_auc

# ---------------- Evaluation ----------------
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
    - mcc
    - log_loss
  primary_threshold: 0.5
  recall_priority_class: -1   # phishing

# ---------------- Explainability ----------------
explainability:
  shap:
    enabled: true
    sample_size: 200          # background dataset size for KernelExplainer
    max_display: 20
  lime:
    enabled: true
    num_samples: 1000
    num_features: 10
